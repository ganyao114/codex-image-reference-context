name: Image reference upstream proposal checks

on:
  push:
    branches: [ci/proposal-image-reference-checks]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUST_MIN_STACK: 8388608
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2e1cbc75b1a02e56031a693eb4e55d719c629d26
          persist-credentials: false
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libcap-dev clang cmake protobuf-compiler
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ runner.os }}-image-proposal-rust-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}
      - name: Configure verified V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Check formatting of changed Rust files
        working-directory: codex-rs
        run: rustfmt --edition 2024 --check core/src/image_reference.rs core/src/tools/handlers/view_image.rs core/src/tools/handlers/view_image_spec.rs core/src/tools/spec_plan.rs core/tests/image_reference_context.rs features/src/lib.rs utils/image/src/artifacts.rs utils/image/src/artifacts_tests.rs
      - name: Test artifact storage
        working-directory: codex-rs
        run: cargo test --locked -p codex-utils-image artifacts::tests --lib
      - name: Test isolated analysis and history boundaries
        working-directory: codex-rs
        run: cargo test --locked -p codex-core --test image_reference_context
      - name: Verify generated configuration schema
        working-directory: codex-rs
        run: |
          cargo run --locked -p codex-config-schema --bin codex-write-config-schema
          git diff --exit-code -- core/config.schema.json
      - name: Clippy for changed image library and core integration target
        working-directory: codex-rs
        run: |
          cargo clippy --locked -p codex-utils-image --lib --tests -- -D warnings
          cargo clippy --locked -p codex-core --test image_reference_context -- -D warnings
      - uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        if: always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ runner.os }}-image-proposal-rust-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}
